       def main():
           """主函数"""
           print("=" * 60)
           print("🌐 IP地址验证与频道列表生成工具")
           print(f"📁 IP目录: {IP_DIR}")
           print(f"📺 频道目录: {CHANNEL_DIR}")
           print(f"⚡ 测速阈值: {SPEED_THRESHOLD} MB/s")
           print("=" * 60)

           # 1. 验证现有IP文件
           validate_existing_ips()

           # 2. 处理外部IP文件
           process_external_ip_file()

           # 3. 生成频道文件 (基于已验证的IP)
           print("\n📺 开始生成频道文件...")
           generate_channel_files()

           print("\n" + "=" * 60)
           print("🎉 任务完成！")
           print("=" * 60)


       if __name__ == "__main__":
           main()
