name: hotel IP Scanner

on:
  schedule:
    # 每隔天下午3点自动运行（UTC时间，北京时间+8）
    - cron: '0 10,22 * * *'
  # push:
  #   # 当脚本文件有更新时触发
  #   paths:
  #     - 'hotel_ip_port.yml'
  # pull_request:
  #   paths:
  #     - 'hotel_ip_port.yml'
  # 支持手动触发
  workflow_dispatch:

jobs:
  hotel-ip:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: 扫描hotel ip
      run: |
        python hotel_IP_Scanner.py
      
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Hotel/ip/results
        git diff --quiet && git diff --staged --quiet || git commit -m "扫描更新 hotel IP $(date '+%Y-%m-%d %H:%M:%S')"
        git push
