name: scan-ip

on:
  workflow_dispatch:  # 手动触发
  schedule:
    # 每天凌晨2点运行（UTC时间，北京时间10点）
    - cron: '0 2 * * *'

jobs:
  scan-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: pip install requests
        
    - name: 创建目录结构
      run: |
        
    - name: 运行IP扫描
      run: python Hotel/scan_ip.py
        
    - name: 查看扫描结果
      run: |
        echo "扫描结果:"
        ls -la Hotel/ip/ 2>/dev/null || echo "没有找到结果目录"
        if [ -d "Hotel/ip" ]; then
          for file in Hotel/ip/*.txt 2>/dev/null; do
            if [ -f "$file" ]; then
              echo "=== $(basename "$file") ==="
              head -5 "$file"
              echo "..."
              wc -l "$file"
              echo ""
            fi
          done
        fi
        
    - name: 上传扫描结果
      uses: actions/upload-artifact@v4
      with:
        name: ip-scan-results
        path: Hotel/ip
        if-no-files-found: warn
